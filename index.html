<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jane Doe — creative portfolio">
<title>Jane Doe — Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap');
:root{--paper:#f1f1ef;--ink:#111;--muted:#666;--line:#aaa;--accent:#e56d68;--pad:clamp(20px,4vw,58px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#d4d4d2;color:var(--ink);font-family:'DM Sans',Arial,sans-serif}
.page{width:min(1180px,calc(100% - 34px));margin:34px auto 70px;display:grid;gap:18px}
.sheet{background:var(--paper);box-shadow:0 5px 14px #0002;position:relative;overflow:hidden;padding:var(--pad);min-height:390px}
.topline{display:flex;justify-content:space-between;align-items:center;font:500 9px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#333}
.date{border:1px solid #777;border-radius:30px;padding:4px 10px;font-size:8px}
h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:-.035em;line-height:.95}
h1{font-size:clamp(64px,11vw,142px);margin:0;text-align:center}
h2{font-size:clamp(40px,6vw,76px);margin:0 0 24px}
h3{font-size:30px;margin:0 0 12px}
p{font-size:12px;line-height:1.65;color:#555}
.small{font-size:9px;line-height:1.55}.mono{font:500 9px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
.signature{font:600 42px 'Caveat',cursive;color:var(--accent);transform:rotate(-12deg);display:inline-block}
.cover{min-height:540px;display:flex;flex-direction:column;justify-content:space-between}
.cover-center{position:relative;display:grid;place-items:center;flex:1}
.cover-center .signature{position:absolute;left:50%;top:51%;transform:translate(-5%,-50%) rotate(-14deg);font-size:clamp(44px,7vw,82px)}
.cover-foot{display:flex;justify-content:space-between;align-items:end}.dots{color:var(--accent);letter-spacing:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:390px}
.split>div{padding:var(--pad)}.split>div+div{border-left:1px solid var(--line)}
.photo{width:100%;height:100%;min-height:230px;object-fit:cover;filter:grayscale(1)}
.intro{display:grid;grid-template-columns:1fr 1.05fr;gap:36px;align-items:center;margin-top:34px}
.intro .photo{height:260px}.lead{font-size:16px;color:#222;line-height:1.35}
.rule{height:1px;background:var(--line);margin:16px 0}
.about-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center}
.about-layout .photo{height:310px}
.accent-dot{width:46px;height:46px;border-radius:50%;background:var(--accent);position:absolute;left:55%;top:45%;opacity:.95}
.concept{display:grid;grid-template-columns:.8fr 1.2fr;min-height:390px}
.concept-image{position:relative;padding:var(--pad);border-right:1px solid var(--line)}
.concept-image img{width:72%;height:270px;object-fit:cover;filter:grayscale(1);display:block;margin:auto}
.concept-copy{padding:var(--pad);display:flex;flex-direction:column;justify-content:center}
.work-list{display:grid;grid-template-columns:1fr 1fr;min-height:410px}
.work-list .list{padding:var(--pad);display:flex;flex-direction:column}
.work-row{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:105px 1fr;gap:20px}
.work-gallery{padding:var(--pad);border-left:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.work-gallery img{width:100%;height:100%;min-height:145px;object-fit:cover;filter:grayscale(1)}
.work-gallery img:first-child{grid-row:span 2}
.portfolio-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mosaic img{width:100%;height:150px;object-fit:cover;filter:grayscale(1)}
.mosaic img:nth-child(2){margin-top:26px}.mosaic img:nth-child(3){margin-top:52px}
.look{display:grid;grid-template-columns:.9fr 1.1fr;gap:32px;align-items:center}
.look-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.look-photos img{width:100%;height:220px;object-fit:cover;filter:grayscale(1)}
.clients{display:grid;grid-template-columns:1fr 1fr;min-height:390px}
.client-list{padding:var(--pad);display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;align-content:center}
.client{border-bottom:1px solid var(--line);padding:10px 0;font:500 10px 'DM Mono',monospace}
.client-image{border-left:1px solid var(--line);padding:14px}.client-image img{width:100%;height:100%;max-height:340px;object-fit:cover;filter:grayscale(1)}
.testimonials{display:grid;grid-template-columns:.8fr 1fr 1fr;min-height:330px}
.testimonials>div{padding:var(--pad)}.testimonials>div+div{border-left:1px solid var(--line)}
.person{display:flex;align-items:center;gap:14px;margin-bottom:18px}.person img{width:62px;height:62px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
.case{display:grid;grid-template-columns:1fr 1fr;min-height:370px}
.case>div{padding:var(--pad)}.case>div+div{border-left:1px solid var(--line)}
.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;font-size:11px}.metric strong{font:500 16px 'Oswald',sans-serif}
.review{display:grid;grid-template-columns:1fr 1fr 1fr;min-height:350px}
.review>div{padding:var(--pad)}.review>div+div{border-left:1px solid var(--line)}
.stars{color:var(--accent);letter-spacing:3px;font-size:18px}
.contact{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;min-height:390px}
.contact img{width:100%;height:300px;object-fit:cover;filter:grayscale(1)}
.contact-line{display:grid;grid-template-columns:90px 1fr;gap:14px;border-bottom:1px solid var(--line);padding:12px 0;font-size:11px}
.footer{display:flex;justify-content:space-between;gap:15px;font:9px 'DM Mono',monospace;color:#555;padding:0 4px}
@media(max-width:700px){.page{width:calc(100% - 20px);margin:10px auto 35px;gap:10px}.sheet{padding:22px;min-height:auto}.cover{min-height:390px}.split,.concept,.work-list,.portfolio-grid,.look,.clients,.case,.contact{grid-template-columns:1fr}.split>div+div,.concept-image,.work-gallery,.client-image,.case>div+div{border:0;border-top:1px solid var(--line)}.intro{grid-template-columns:1fr;gap:18px}.about-layout{grid-template-columns:1fr}.about-layout .photo{height:250px}.concept-image img{height:220px}.work-gallery{min-height:260px}.work-gallery img{min-height:120px}.mosaic img{height:120px}.look-photos img{height:150px}.clients{min-height:0}.client-image img{height:240px}.testimonials,.review{grid-template-columns:1fr}.testimonials>div+div,.review>div+div{border:0;border-top:1px solid var(--line)}.contact img{height:240px}.accent-dot{display:none}}
</style>
</head>
<body>
<main class="page" id="app">
<section class="sheet cover">
  <div class="topline"><span data-brand>ICONIC</span><span class="date" data-date>15 May 2030</span></div>
  <div class="cover-center"><h1>PORTFOLIO</h1><span class="signature" data-name>Jane Doe</span></div>
  <div class="cover-foot"><div><div class="mono" data-name>JANE DOE</div><p class="small" data-role>Creative Director · Fashion & Visual Design</p></div><span class="dots">•••</span></div>
</section>
<section class="sheet">
  <div class="topline"><span data-brand>ICONIC</span><span class="date" data-date></span></div>
  <div class="intro"><div><h2 data-name>JANE DOE</h2><div class="rule"></div><div class="mono">INTRODUCTION</div><p class="lead" data-intro></p><p data-tagline></p><span class="signature" data-name>Jane Doe</span></div><img class="photo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85" alt="Editorial portrait"></div>
</section>
<section class="sheet about-layout">
  <div><div class="topline"><span data-brand>ICONIC</span><span class="date" data-date></span></div><h2 style="margin-top:38px">ABOUT US</h2><p class="lead" data-about-lead></p><p data-about-body></p><div class="rule"></div><ul id="skills" class="small"></ul></div>
  <img class="photo" src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1000&q=85" alt="Fashion portrait">
</section>
